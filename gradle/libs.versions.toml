[versions]
#jetbrains
kotlin = "2.2.10"
#KSP
ksp = "2.2.10-2.0.2"
#AndroidX
androidx-swiperefreshlayout = "1.1.0"
androidx-constraintlayout = "2.2.1"
androidx-documentfile = "1.1.0"
androidx-print = "1.1.0"
androidx-emoji2-emojipicker = "1.6.0"
#exif
exif = "1.0.1"
#Room
room = "2.8.4"
#Simple tools
simple-commons = "9e60e2479050b9dcc9d8fccdc240398a5f993184"
#Gradle
gradlePlugins-agp = "8.13.2"
#Other
androidGifDrawable = "1.2.32"
androidImageCropper = "4.6.0"
animationAndroid = "3.0.5"
glideCompiler = "4.16.0"
zjupureWebpdecoder = "2.6.4.16.0"
jxlDecoder = "2.6.1"
gestureviews = "a8e8fa8d27"
androidsvgAar = "1.4"
imagefilters = "1.0.2"
sanselan = "0.97-incubator"
media3Exoplayer = "1.10.1"
okhttp = "4.12.0"
okio = "3.18.2"
picasso = "2.71828"
ncnnPpocr = "v1.3.0"
#build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
#versioning
app-version-appId = "tomato.gallery"
app-version-versionCode = "100"
app-version-versionName = "1.0"
subsamplingScaleImageView = "80efdaa570"
[libraries]
#AndroidX
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3Exoplayer" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-print = { module = "androidx.print:print", version.ref = "androidx-print" }
androidx-emoji2-emojipicker = { module = "androidx.emoji2:emoji2-emojipicker", version.ref = "androidx-emoji2-emojipicker" }
#exif
exif = { module = "it.sephiroth.android.exif:library", version.ref = "exif" }
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
#Simple Mobile Tools
simple-tools-commons = { module = "com.github.SimpleMobileTools:Simple-Commons", version.ref = "simple-commons" }
#Other
android-gif-drawable = { module = "pl.droidsonroids.gif:android-gif-drawable", version.ref = "androidGifDrawable" }
android-image-cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "androidImageCropper" }
subsamplingscaleimageview = { module = "com.github.tibbi:subsampling-scale-image-view", version.ref = "subsamplingScaleImageView" }
androidsvg-aar = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvgAar" }
gestureviews = { module = "com.github.tibbi:gestureviews", version.ref = "gestureviews" }
imagefilters = { module = "com.github.zomato:androidphotofilters", version.ref = "imagefilters" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
sanselan = { module = "org.apache.sanselan:sanselan", version.ref = "sanselan" }
apng = { module = "com.github.penfeizhou.android.animation:apng", version.ref = "animationAndroid" }
awebp = { module = "com.github.penfeizhou.android.animation:awebp", version.ref = "animationAndroid" }
avif = { module = "com.github.penfeizhou.android.animation:avif", version.ref = "animationAndroid" }
glide-compiler = { module = "com.github.bumptech.glide:ksp", version.ref = "glideCompiler" }
zjupure-webpdecoder = { module = "com.github.zjupure:webpdecoder", version.ref = "zjupureWebpdecoder" }
avif-integration = { group = "com.github.bumptech.glide", name = "avif-integration", version.ref = "glideCompiler" }
jxl-coder = { group = "io.github.awxkee", name = "jxl-coder", version.ref = "jxlDecoder" }
jxl-integration = { group = "io.github.awxkee", name = "jxl-coder-glide", version.ref = "jxlDecoder" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
ncnn-ppocr = { module = "com.github.equationl.paddleocr4android:ncnnandroidppocr", version.ref = "ncnnPpocr" }
[bundles]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
